# hybrid-syncer configuration manifest
default_branch: "master"

authoring:
  default_email: "syncer@example.com"
  default_name: "Hybrid Syncer"

# Top-level repository alias registry
repositories:
  repo1: "./sample-repos/repo-1.git"
  repo2: "./sample-repos/repo-2.git"
  hybrid: "./sample-repos/hybrid"

targets:
  repo-1-a:
    origin:
      repo: repo1
      path: "a"
    destinations:
      - name: main
        repo: hybrid
        path: "repo-1/a"
      - name: repo-2
        repo: repo2
        path: "repo-1/a"

  repo-1-b:
    origin:
      repo: repo1
      path: "b"
    destinations:
      - name: main
        repo: hybrid
        path: "repo-1/b"
      - name: repo-2
        repo: repo2
        path: "repo-1/b"

  repo-2-a:
    origin:
      repo: repo2
      path: "a"
    destinations:
      - name: main
        repo: hybrid
        path: "repo-2/a"
